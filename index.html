<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Friend Follow | ระบบดันยอดอัตโนมัติ</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --pink:#ff9ed6;
  --blue:#8fd3ff;
  --purple:#caa6ff;
}

body{
  margin:0;
  font-family:'Prompt',sans-serif;
  height:100vh;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:linear-gradient(135deg,#1a1022,#0e1a2a,#1b1230);
  color:white;
}

@media (prefers-color-scheme: light){
  body{
    background:linear-gradient(135deg,#ffe6f6,#eaf6ff,#f3e8ff);
    color:#333;
  }
}

canvas{
  position:absolute;
  top:0;
  left:0;
  z-index:-3;
}

/* fade */
.container{
  max-width:850px;
  padding:20px;
  opacity:0;
  transform:translateY(20px);
  transition:1.5s ease;
}
.container.show{
  opacity:1;
  transform:translateY(0);
}

/* logo */
.logo{
  width:120px;
  border-radius:30px;
  animation:spin 18s linear infinite;
  box-shadow:0 0 40px rgba(200,160,255,.7);
}
@keyframes spin{
  from{transform:rotateY(0)}
  to{transform:rotateY(360deg)}
}

h1{
  font-size:32px;
  background:linear-gradient(90deg,var(--pink),var(--blue),var(--purple));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.tagline{
  margin-top:10px;
  font-size:15px;
  opacity:.9;
}

/* bubble stats (แทนสี่เหลี่ยม) */
.stats{
  margin-top:25px;
  display:flex;
  justify-content:center;
  gap:25px;
  flex-wrap:wrap;
}

.statBubble{
  background:linear-gradient(145deg,#ff9ed6,#caa6ff);
  padding:20px 25px;
  border-radius:50px;
  box-shadow:0 10px 30px rgba(200,160,255,.4);
  min-width:150px;
}

.statNumber{
  font-size:22px;
  font-weight:bold;
}

.reason{
  margin-top:25px;
  font-size:14px;
  line-height:1.8;
}

/* review bubble */
.reviewBubble{
  position:fixed;
  bottom:-120px;
  left:50%;
  transform:translateX(-50%);
  background:linear-gradient(145deg,#ff9ed6,#caa6ff);
  padding:16px 22px;
  border-radius:40px;
  font-size:14px;
  box-shadow:0 15px 40px rgba(200,160,255,.6);
  animation:floatReview 18s ease forwards;
  display:flex;
  gap:10px;
}

@keyframes floatReview{
  70%{opacity:1;}
  100%{
    transform:translate(-50%,-80vh);
    opacity:.9;
  }
}

/* order toast */
.toast{
  position:fixed;
  bottom:25px;
  right:25px;
  background:linear-gradient(135deg,#8fd3ff,#caa6ff);
  padding:15px 20px;
  border-radius:25px;
  font-size:13px;
  box-shadow:0 0 25px rgba(200,160,255,.6);
  transition:.6s;
}

/* line button */
.lineBtn{
  margin-top:25px;
  display:inline-block;
  padding:14px 28px;
  border-radius:50px;
  background:#00c300;
  color:white;
  font-weight:600;
  text-decoration:none;
  box-shadow:0 8px 25px rgba(0,195,0,.4);
  transition:.3s;
}
.lineBtn:hover{
  transform:scale(1.05);
}
</style>
</head>
<body>

<audio id="popSound" preload="auto">
<source src="https://assets.mixkit.co/sfx/preview/mixkit-bubble-pop-1993.mp3">
</audio>

<audio id="dingSound" preload="auto">
<source src="https://assets.mixkit.co/sfx/preview/mixkit-positive-interface-beep-221.mp3">
</audio>

<div class="container" id="content">

<img src="https://raw.githubusercontent.com/friendfollowofficial/about/a57288448586e9acebdef505ff8397bd609be80b/logo.png" class="logo">

<h1>Friend Follow</h1>

<div class="tagline">
ระบบดันยอดอัตโนมัติ • เพิ่มผู้ติดตาม • ดันคลิป • เพิ่มหัวใจ
</div>

<div class="stats">
<div class="statBubble">TikTok<br><div class="statNumber" id="tk"></div></div>
<div class="statBubble">Instagram<br><div class="statNumber" id="ig"></div></div>
<div class="statBubble">Facebook<br><div class="statNumber" id="fb"></div></div>
</div>

<div class="reason">
<b>ทำไมต้องใช้บริการกับเรา?</b><br>
✔ ระบบอัตโนมัติทำงานรวดเร็ว<br>
✔ ปลอดภัยต่อบัญชี ไม่หลุด<br>
✔ เช็คสถานะได้ตลอดเวลา<br>
✔ ให้บริการต่อเนื่องทุกวัน 24 ชม.
</div>

<a href="https://line.me/R/ti/p/@geg4960w" class="lineBtn">
ติดต่อแอดมิน Line : @geg4960w
</a>

</div>

<script>

/* fade */
window.onload=()=>content.classList.add("show");

/* daily number lock */
function seed(max){
let d=new Date().toISOString().slice(0,10);
let h=0;
for(let i=0;i<d.length;i++){h=d.charCodeAt(i)+((h<<5)-h);}
return Math.abs(h%max);
}
tk.innerText=seed(200)+100;
ig.innerText=seed(150)+80;
fb.innerText=seed(120)+60;

/* review */
const names=["Mxxy","Ployya","Namtanx","Jxmmy","Praewa","Mildd"];
const msgs=[
"แอดใจดีมากแถมเยอะมาก 💗",
"ยอดขึ้นเร็วแบบไม่คิดว่าจะไวขนาดนี้",
"บริการดีมาก สั่งซ้ำแน่นอน",
"ระบบไวสุด ๆ ไม่มีสะดุด"
];

function mask(n){
return n[0]+"***"+n[n.length-1];
}

function review(){
let div=document.createElement("div");
div.className="reviewBubble";
div.innerHTML=`💗 <b>${mask(names[Math.floor(Math.random()*names.length)])}</b><br>
${msgs[Math.floor(Math.random()*msgs.length)]}`;
document.body.appendChild(div);
popSound.volume=0.3;
popSound.play();
setTimeout(()=>div.remove(),18000);
}
setInterval(review,40000);

/* order toast */
function order(){
let div=document.createElement("div");
div.className="toast";
div.innerHTML="<b>FF-******</b><br>กำลังดำเนินการ";
document.body.appendChild(div);
dingSound.volume=0.2;
dingSound.play();
setTimeout(()=>div.remove(),8000);
}
setInterval(order,25000);

</script>
</body>
</html>
