<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Friend Follow | บริการทุกแพลตฟอร์มราคาถูก</title>

<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --pink:#ff9ed6;
  --blue:#8fd3ff;
  --purple:#caa6ff;
}

body{
  margin:0;
  font-family:'Prompt',sans-serif;
  height:100vh;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:linear-gradient(135deg,#1a1022,#0e1a2a,#1b1230);
  color:white;
}

@media (prefers-color-scheme: light){
  body{
    background:linear-gradient(135deg,#ffe6f6,#eaf6ff,#f3e8ff);
    color:#333;
  }
}

canvas{
  position:absolute;
  top:0;
  left:0;
  z-index:-3;
}

.container{
  max-width:900px;
  opacity:0;
  transform:translateY(20px);
  transition:1.5s;
}
.container.show{
  opacity:1;
  transform:translateY(0);
}

.logo-scene{
  perspective:800px;
}
.logo{
  width:110px;
  border-radius:28px;
  animation:spin 12s linear infinite;
  box-shadow:0 0 40px rgba(200,160,255,.6);
}
@keyframes spin{
  from{transform:rotateY(0)}
  to{transform:rotateY(360deg)}
}

h1{
  font-size:30px;
  font-weight:700;
  background:linear-gradient(90deg,var(--pink),var(--blue),var(--purple));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:shimmer 4s infinite;
}
@keyframes shimmer{
  0%{filter:brightness(1)}
  50%{filter:brightness(1.4)}
  100%{filter:brightness(1)}
}

.tagline{
  margin-top:10px;
  font-size:15px;
  line-height:1.8;
}

.platforms{
  margin-top:25px;
  display:flex;
  gap:20px;
  justify-content:center;
  flex-wrap:wrap;
}

.card{
  background:rgba(255,255,255,.05);
  backdrop-filter:blur(10px);
  padding:15px 20px;
  border-radius:18px;
  width:220px;
  box-shadow:0 0 20px rgba(200,160,255,.3);
}

.number{
  font-size:24px;
  font-weight:bold;
  color:var(--pink);
}

.reason{
  margin-top:25px;
  font-size:14px;
  opacity:.9;
  line-height:1.7;
}

/* bubble */
.bubble{
  position:absolute;
  bottom:-100px;
  border-radius:50%;
  opacity:.12;
  background:linear-gradient(145deg,var(--pink),var(--purple));
  animation:floatUp linear infinite;
}

@keyframes floatUp{
  from{transform:translateY(0);}
  to{transform:translateY(-120vh);}
}

/* flower */
.flower{
  position:absolute;
  font-size:18px;
  opacity:.6;
  animation:floatUp linear infinite;
}

/* toast */
.toast{
  position:fixed;
  bottom:20px;
  right:20px;
  background:linear-gradient(135deg,#ff9ed6,#8fd3ff,#caa6ff);
  color:white;
  padding:14px 18px;
  border-radius:18px;
  font-size:13px;
  box-shadow:0 0 25px rgba(200,160,255,.6);
  transition:all .6s ease;
}

/* ================= REVIEW BUBBLE ================= */

.reviewBubble{
  position:fixed;
  bottom:-140px;
  left:50%;
  transform:translateX(-50%);
  background:linear-gradient(145deg,#ff9ed6,#caa6ff);
  padding:18px 24px;
  border-radius:40px;
  font-size:14px;
  box-shadow:0 20px 60px rgba(200,160,255,.8);
  animation:floatReview 26s ease forwards;
  max-width:320px;
  opacity:1;
}

@keyframes floatReview{
  0%{opacity:0;}
  10%{opacity:1;}
  80%{opacity:1;}
  100%{
    transform:translate(-50%,-85vh);
    opacity:.95;
  }
}

/* ================= FLOAT LINE BUTTON ================= */

.lineFloat{
  position:fixed;
  bottom:25px;
  right:25px;
  padding:14px 22px;
  border-radius:50px;
  background:linear-gradient(135deg,#ff9ed6,#8fd3ff,#caa6ff);
  color:white;
  font-weight:600;
  text-decoration:none;
  box-shadow:0 20px 50px rgba(200,160,255,.5);
  transition:.3s;
  z-index:99;
}
.lineFloat:hover{
  transform:scale(1.08);
}

/* effect ตอนเลขเพิ่ม */
.number.bump{
  animation:popNumber .5s ease;
}

@keyframes popNumber{
  0%{transform:scale(1);}
  50%{transform:scale(1.25);}
  100%{transform:scale(1);}
}

/* +1 ลอย */
.floatPlus{
  position:absolute;
  font-size:14px;
  color:#ff9ed6;
  animation:floatUpPlus 1.2s ease forwards;
}

@keyframes floatUpPlus{
  0%{opacity:1; transform:translateY(0);}
  100%{opacity:0; transform:translateY(-25px);}
}






  

  
</style>
</head>
<body>

<audio id="popSound">
  <source src="https://assets.mixkit.co/sfx/preview/mixkit-bubble-pop-1993.mp3">
</audio>

<audio id="dingSound">
  <source src="https://assets.mixkit.co/sfx/preview/mixkit-positive-interface-beep-221.mp3">
</audio>

  
<canvas id="network"></canvas>

<div class="container" id="content">

  <div class="logo-scene">
    <img src="https://raw.githubusercontent.com/friendfollowofficial/about/a57288448586e9acebdef505ff8397bd609be80b/logo.png" class="logo">
  </div>

  <h1>Friend Follow</h1>

  <div class="tagline">
    ระบบดันยอดอัตโนมัติ<br>
    เพิ่มผู้ติดตาม • ดันคลิปฟีด • เพิ่มหัวใจ<br>
           และอื่นๆอีกมากมาย
  </div>

  <div class="platforms">
    <div class="card">
      TikTok<br>
      <div class="number" id="tiktok">0</div>
      ออเดอร์วันนี้
    </div>

    <div class="card">
      Instagram<br>
      <div class="number" id="ig">0</div>
      ออเดอร์วันนี้
    </div>

    <div class="card">
      Facebook<br>
      <div class="number" id="fb">0</div>
      ออเดอร์วันนี้
    </div>
  </div>

  <div class="reason">
    <b>ทำไมต้องใช้บริการกับเรา ?</b><br>
    ระบบทำงานรวดเร็ว • ปลอดภัย • เช็คสถานะได้ตลอดเวลา<br>
    ยอดทยอยขึ้นแบบธรรมชาติ 100 % 
  </div>

</div>

<script>

/* fade in */
window.onload=()=>document.getElementById("content").classList.add("show");

/* ================= AI NETWORK ================= */

const canvas=document.getElementById("network");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let nodes=[];
for(let i=0;i<40;i++){
  nodes.push({
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    vx:(Math.random()-0.5)*0.5,
    vy:(Math.random()-0.5)*0.5
  });
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  nodes.forEach(n=>{
    n.x+=n.vx;
    n.y+=n.vy;
    if(n.x<0||n.x>canvas.width) n.vx*=-1;
    if(n.y<0||n.y>canvas.height) n.vy*=-1;
    ctx.beginPath();
    ctx.arc(n.x,n.y,2,0,Math.PI*2);
    ctx.fillStyle="#ffffff40";
    ctx.fill();
  });

  for(let i=0;i<nodes.length;i++){
    for(let j=i+1;j<nodes.length;j++){
      let dx=nodes[i].x-nodes[j].x;
      let dy=nodes[i].y-nodes[j].y;
      let dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<120){
        ctx.beginPath();
        ctx.moveTo(nodes[i].x,nodes[i].y);
        ctx.lineTo(nodes[j].x,nodes[j].y);
        ctx.strokeStyle="#ffffff20";
        ctx.stroke();
      }
    }
  }

  requestAnimationFrame(draw);
}
draw();

/* ================= LIVE DAILY JUMP SYSTEM ================= */

function todayKey(){
  return new Date().toISOString().slice(0,10);
}

function minutesSinceMidnight(){
  const now = new Date();
  return now.getHours()*60 + now.getMinutes();
}

// max ต่อวัน (TikTok เยอะสุด)
const tkMax = 300;
const igMax = 220;
const fbMax = 150;

let currentValues = {
  tiktok: 0,
  ig: 0,
  fb: 0
};

function targetValue(max){
  const mins = minutesSinceMidnight();
  let ratio = mins / 1440;

  // peak 10:00-16:00
  if(mins >= 600 && mins <= 960){
    ratio += 0.2;
  }

  if(ratio > 1) ratio = 1;

  const key = todayKey();
  let hash = 0;
  for(let i=0;i<key.length;i++){
    hash = key.charCodeAt(i) + ((hash<<5)-hash);
  }

  const dayFactor = Math.abs(hash % 40);

  return Math.floor((max - 40 + dayFactor) * ratio);
}

function jumpIncrease(id, max){

  const target = targetValue(max);
  const el = document.getElementById(id);

  if(currentValues[id] < target){

    currentValues[id]++;

    el.innerText = currentValues[id];

    // เด้ง
    el.classList.add("bump");
    setTimeout(()=>el.classList.remove("bump"),500);

    // +1 ลอย
    const plus = document.createElement("div");
    plus.className="floatPlus";
    plus.innerText="+1";
    plus.style.left = el.getBoundingClientRect().left + "px";
    plus.style.top = el.getBoundingClientRect().top + "px";
    document.body.appendChild(plus);

    setTimeout(()=>plus.remove(),1200);
  }
}

// interval ต่างกัน → TikTok ไวสุด
setInterval(()=>jumpIncrease("tiktok", tkMax), 2500);
setInterval(()=>jumpIncrease("ig", igMax), 4000);
setInterval(()=>jumpIncrease("fb", fbMax), 6000);

/* ================= FLOWERS ================= */

const flowers=["🌸","🌷","💮","🌺"];
for(let i=0;i<10;i++){
  let f=document.createElement("div");
  f.className="flower";
  f.innerText=flowers[Math.floor(Math.random()*flowers.length)];
  f.style.left=Math.random()*100+"%";
  f.style.animationDuration=(Math.random()*20+15)+"s";
  document.body.appendChild(f);
}

/* ================= BUBBLES ================= */

for(let i=0;i<15;i++){
  let b=document.createElement("div");
  b.className="bubble";
  let size=Math.random()*60+20;
  b.style.width=size+"px";
  b.style.height=size+"px";
  b.style.left=Math.random()*100+"%";
  b.style.animationDuration=(Math.random()*25+15)+"s";
  document.body.appendChild(b);
}

/* ================= ORDER TOAST ONLY ================= */

const statuses = [
  "ชำระเงินแล้ว",
  "กำลังดำเนินการ",
  "เสร็จงาน"
];

function generateOrderID(){
  let d = new Date();
  return "FF-" +
    d.getFullYear().toString().slice(2) +
    String(d.getMonth()+1).padStart(2,"0") +
    String(d.getDate()).padStart(2,"0") +
    "-" +
    (Math.floor(Math.random()*9000)+1000);
}

function maskOrderID(id){
  // ปิดเลขท้าย
  return id.slice(0, id.length-3) + "***";
}

function showOrderToast(){
  let fullID = generateOrderID();
  let maskedID = maskOrderID(fullID);

  let status = statuses[Math.floor(Math.random()*statuses.length)];
  let mins = Math.floor(Math.random()*20)+1;

  const toast = document.createElement("div");




  
  toast.className="toast";
  toast.innerHTML = `
    <b>${maskedID}</b><br>
    ${status}<br>
    ${mins} นาทีที่แล้ว
  `;

  document.body.appendChild(toast);
 document.getElementById("dingSound").volume = 0.25;
 document.getElementById("dingSound").play();
  

  setTimeout(()=>{
    toast.style.opacity="0";
    toast.style.transform="translateY(10px)";
  },7000);

  setTimeout(()=>{
    toast.remove();
  },8000);
}

/* ขึ้นทุก 18 วิ */
setInterval(()=>{
  showOrderToast();
},18000);

/* ================= REVIEW SYSTEM ================= */

const reviewNames = [
  "Mxxy","Pxxxxw","Nxxxxxx",
  "Jxxxy","Pxxxxa","ZxxxE","Fxxi"
];

const reviewMessages = [
  "แอดใจดีมากแถมเยอะมาก 💗",
  "ยอดขึ้นเร็วจริง",
  "บริการดีมากค่ะ",
  "ระบบไวสุด ๆ",
  "ใช้ครั้งแรกแอดใจดีมากกกก"
];

function maskName(name){
  let visibleStart = 1;
  let visibleEnd = Math.floor(Math.random()*2);
  let masked = name.substring(0,visibleStart);
  masked += "*".repeat(name.length-visibleStart-visibleEnd);
  if(visibleEnd>0){
    masked += name.substring(name.length-visibleEnd);
  }
  return masked;
}

function createReviewBubble(){

  const bubble = document.createElement("div");
  bubble.className="reviewBubble";

  const randomName = reviewNames[Math.floor(Math.random()*reviewNames.length)];
  const randomMsg = reviewMessages[Math.floor(Math.random()*reviewMessages.length)];

  bubble.innerHTML = `
    💖 <b>${maskName(randomName)}</b><br>
    ${randomMsg}
  `;

  document.body.appendChild(bubble);

  const pop = document.getElementById("popSound");
  pop.volume = 0.3;
  pop.play();

  setTimeout(()=>{
    bubble.remove();
  },25000);
}

/* ทุก 50 วิ */
setInterval(()=>{
  createReviewBubble();
},50000);


  

</script>
</body>
</html>
