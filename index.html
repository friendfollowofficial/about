<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Friend Follow | ระบบดันยอดอัตโนมัติ</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --pink:#ff9ed6;
  --blue:#8fd3ff;
  --purple:#caa6ff;
}

body{
  margin:0;
  font-family:'Prompt',sans-serif;
  height:100vh;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:linear-gradient(135deg,#1a1022,#0e1a2a,#1b1230);
  color:white;
}

@media (prefers-color-scheme: light){
  body{
    background:linear-gradient(135deg,#ffe6f6,#eaf6ff,#f3e8ff);
    color:#333;
  }
}

canvas{
  position:absolute;
  top:0;
  left:0;
  z-index:-3;
}

/* fade */
.container{
  max-width:900px;
  opacity:0;
  transform:translateY(20px);
  transition:1.5s ease;
}
.container.show{
  opacity:1;
  transform:translateY(0);
}

/* logo */
.logo{
  width:120px;
  border-radius:28px;
  animation:spin 14s linear infinite;
  box-shadow:0 0 40px rgba(200,160,255,.6);
}
@keyframes spin{
  from{transform:rotateY(0)}
  to{transform:rotateY(360deg)}
}

h1{
  font-size:32px;
  font-weight:700;
  background:linear-gradient(90deg,var(--pink),var(--blue),var(--purple));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:shimmer 4s infinite;
}
@keyframes shimmer{
  50%{filter:brightness(1.4);}
}

.tagline{
  font-size:15px;
  margin-top:8px;
}

.platforms{
  margin-top:25px;
  display:flex;
  gap:20px;
  justify-content:center;
  flex-wrap:wrap;
}

.card{
  background:rgba(255,255,255,.05);
  backdrop-filter:blur(12px);
  padding:18px 20px;
  border-radius:20px;
  width:220px;
  box-shadow:0 0 20px rgba(200,160,255,.3);
}

.number{
  font-size:24px;
  font-weight:bold;
  color:var(--pink);
}

.reason{
  margin-top:20px;
  font-size:14px;
  opacity:.9;
  line-height:1.7;
}

/* toast */
.toast{
  position:fixed;
  bottom:25px;
  right:25px;
  background:linear-gradient(135deg,#ff9ed6,#8fd3ff,#caa6ff);
  padding:15px 20px;
  border-radius:18px;
  font-size:13px;
  box-shadow:0 0 25px rgba(200,160,255,.6);
  transition:.6s;
}

/* review bubble */
.reviewBubble{
  position:fixed;
  bottom:-120px;
  left:50%;
  transform:translateX(-50%);
  background:linear-gradient(145deg,#ff9ed6,#caa6ff);
  padding:14px 20px;
  border-radius:30px;
  font-size:13px;
  box-shadow:0 10px 30px rgba(200,160,255,.6);
  animation:floatReview 12s ease forwards;
  display:flex;
  align-items:flex-start;
  gap:8px;
}

@keyframes floatReview{
  100%{
    transform:translate(-50%,-85vh);
    opacity:0;
  }
}

.platformIcon{
  font-size:16px;
}

/* flowers & bubbles */
.flower,.bubble{
  position:absolute;
  animation:floatBg linear infinite;
}
@keyframes floatBg{
  100%{transform:translateY(-120vh);}
}
</style>
</head>
<body>

<canvas id="network"></canvas>

<audio id="popSound" preload="auto">
<source src="https://assets.mixkit.co/sfx/preview/mixkit-bubble-pop-1993.mp3">
</audio>

<audio id="dingSound" preload="auto">
<source src="https://assets.mixkit.co/sfx/preview/mixkit-positive-interface-beep-221.mp3">
</audio>

<div class="container" id="content">

<img src="https://raw.githubusercontent.com/friendfollowofficial/about/a57288448586e9acebdef505ff8397bd609be80b/logo.png" class="logo">

<h1>Friend Follow</h1>

<div class="tagline">
ระบบดันยอดอัตโนมัติ • เพิ่มผู้ติดตาม • ดันคลิปฟีด • เพิ่มหัวใจ
</div>

<div class="platforms">
<div class="card">TikTok<br><div class="number" id="tiktok"></div>ออเดอร์วันนี้</div>
<div class="card">Instagram<br><div class="number" id="ig"></div>ออเดอร์วันนี้</div>
<div class="card">Facebook<br><div class="number" id="fb"></div>ออเดอร์วันนี้</div>
</div>

<div class="reason">
ระบบทำงานอัตโนมัติรวดเร็ว • ปลอดภัยต่อบัญชี • เช็คสถานะได้ตลอดเวลา<br>
ให้บริการต่อเนื่องทุกวัน ตลอด 24 ชั่วโมง
</div>

</div>

<script>

/* fade */
window.onload=()=>content.classList.add("show");

/* daily lock */
function seed(max){
let d=new Date().toISOString().slice(0,10);
let h=0;
for(let i=0;i<d.length;i++){h=d.charCodeAt(i)+((h<<5)-h);}
return Math.abs(h%max);
}
tiktok.innerText=seed(180)+100;
ig.innerText=seed(150)+80;
fb.innerText=seed(120)+60;

/* network with lines */
const canvas=network;
const ctx=canvas.getContext("2d");
canvas.width=innerWidth;
canvas.height=innerHeight;
let nodes=[...Array(35)].map(()=>({x:Math.random()*canvas.width,y:Math.random()*canvas.height,vx:(Math.random()-0.5)*0.4,vy:(Math.random()-0.5)*0.4}));
(function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);
nodes.forEach(n=>{
n.x+=n.vx;n.y+=n.vy;
if(n.x<0||n.x>canvas.width)n.vx*=-1;
if(n.y<0||n.y>canvas.height)n.vy*=-1;
ctx.beginPath();ctx.arc(n.x,n.y,2,0,Math.PI*2);
ctx.fillStyle="#ffffff40";ctx.fill();
});
for(let i=0;i<nodes.length;i++){
for(let j=i+1;j<nodes.length;j++){
let dx=nodes[i].x-nodes[j].x;
let dy=nodes[i].y-nodes[j].y;
let dist=Math.sqrt(dx*dx+dy*dy);
if(dist<120){
ctx.beginPath();
ctx.moveTo(nodes[i].x,nodes[i].y);
ctx.lineTo(nodes[j].x,nodes[j].y);
ctx.strokeStyle="#ffffff20";
ctx.stroke();
}
}
}
requestAnimationFrame(draw);
})();

/* flowers */
const flowers=["🌸","🌺","🌷"];
for(let i=0;i<10;i++){
let f=document.createElement("div");
f.className="flower";
f.innerText=flowers[Math.floor(Math.random()*flowers.length)];
f.style.left=Math.random()*100+"%";
f.style.animationDuration=(Math.random()*20+15)+"s";
document.body.appendChild(f);
}

/* bubbles */
for(let i=0;i<15;i++){
let b=document.createElement("div");
b.className="bubble";
let size=Math.random()*60+20;
b.style.width=size+"px";
b.style.height=size+"px";
b.style.left=Math.random()*100+"%";
b.style.background="linear-gradient(145deg,#ff9ed6,#caa6ff)";
b.style.opacity=".12";
b.style.animationDuration=(Math.random()*25+15)+"s";
document.body.appendChild(b);
}

/* review bubble */
const names=["Mxxy","Ployya","Namtanx","Jxmmy","Praewa","Mildd"];
const msgs=["แอดใจดีมากแถมเยอะมาก 💗","ยอดขึ้นเร็วจริง","บริการดีมากค่ะ","ระบบไวสุด ๆ"];
const icons=["🎵","📸","👍"];
function mask(n){
let hide=Math.floor(Math.random()*(n.length-1));
return n[0]+("*".repeat(n.length-1-hide))+(hide>0?n.slice(-hide):"");
}
let reviewActive=false;

function review(){
if(reviewActive)return;
reviewActive=true;
let div=document.createElement("div");
div.className="reviewBubble";
div.innerHTML=`<div class="platformIcon">${icons[Math.floor(Math.random()*icons.length)]}</div>
<div><b>${mask(names[Math.floor(Math.random()*names.length)])}</b><br>
${msgs[Math.floor(Math.random()*msgs.length)]}</div>`;
document.body.appendChild(div);
popSound.volume=0.25;popSound.play();
setTimeout(()=>{div.remove();reviewActive=false;},12000);
}
setInterval(review,35000);

/* order toast */
const statuses=["ชำระเงินแล้ว","กำลังดำเนินการ","เสร็จงาน"];
function orderID(){
let d=new Date();
return "FF-"+d.getFullYear().toString().slice(2)+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0")+"-"+(Math.floor(Math.random()*9000)+1000);
}
function maskOrder(id){return id.slice(0,id.length-3)+"***";}
let toastActive=false;

function order(){
if(toastActive)return;
toastActive=true;
let div=document.createElement("div");
div.className="toast";
div.innerHTML=`<b>${maskOrder(orderID())}</b><br>
${statuses[Math.floor(Math.random()*3)]}<br>
${Math.floor(Math.random()*20)+1} นาทีที่แล้ว`;
document.body.appendChild(div);
dingSound.volume=0.2;dingSound.play();
setTimeout(()=>{div.style.opacity="0"},7000);
setTimeout(()=>{div.remove();toastActive=false;},8000);
}
setInterval(order,20000);

</script>
</body>
</html>
