<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Friend Follow | บริการเพิ่มผู้ติดตาม เปิดการมองเห็นทุกแพลตฟอร์ม </title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --pink:#ff9ed6;
  --blue:#8fd3ff;
  --purple:#caa6ff;
}

body{
  margin:0;
  font-family:'Prompt',sans-serif;
  height:100vh;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:linear-gradient(135deg,#1e1330,#111c2c,#24163c);
  color:white;
}

/* fade */
.container{
  max-width:900px;
  padding:20px;
  opacity:0;
  transform:translateY(20px);
  transition:1.5s ease;
}
.container.show{
  opacity:1;
  transform:translateY(0);
}

/* logo */
.logo{
  width:120px;
  border-radius:30px;
  animation:spin 20s linear infinite;
  box-shadow:0 0 45px rgba(200,160,255,.7);
}
@keyframes spin{
  from{transform:rotateY(0)}
  to{transform:rotateY(360deg)}
}

h1{
  font-size:32px;
  background:linear-gradient(90deg,var(--pink),var(--blue),var(--purple));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* stat bubbles */
.stats{
  margin-top:25px;
  display:flex;
  justify-content:center;
  gap:25px;
  flex-wrap:wrap;
}

.stat{
  background:linear-gradient(145deg,#ff9ed6,#caa6ff);
  padding:20px 30px;
  border-radius:60px;
  box-shadow:0 15px 40px rgba(200,160,255,.4);
  min-width:160px;
}

.number{
  font-size:22px;
  font-weight:bold;
}

/* reason */
.reason{
  margin-top:25px;
  font-size:14px;
  line-height:1.8;
  opacity:.9;
}

/* floating LINE button */
.lineFloat{
  position:fixed;
  bottom:25px;
  right:25px;
  padding:14px 22px;
  border-radius:50px;
  background:linear-gradient(135deg,#ff9ed6,#8fd3ff);
  color:white;
  font-weight:600;
  text-decoration:none;
  box-shadow:0 15px 40px rgba(200,160,255,.5);
  transition:.3s;
}
.lineFloat:hover{
  transform:scale(1.08);
}

/* review bubble */
.reviewBubble{
  position:fixed;
  bottom:-120px;
  left:50%;
  transform:translateX(-50%);
  background:linear-gradient(145deg,#ff9ed6,#caa6ff);
  padding:18px 24px;
  border-radius:40px;
  font-size:14px;
  box-shadow:0 20px 50px rgba(200,160,255,.7);
  animation:floatReview 22s ease forwards;
}
@keyframes floatReview{
  80%{opacity:1;}
  100%{transform:translate(-50%,-85vh);}
}

/* order toast */
.toast{
  position:fixed;
  bottom:100px;
  right:25px;
  background:linear-gradient(135deg,#8fd3ff,#caa6ff);
  padding:14px 18px;
  border-radius:25px;
  font-size:13px;
  box-shadow:0 0 25px rgba(200,160,255,.6);
  transition:.6s;
}

/* flowers */
.flower,.bubble{
  position:absolute;
  animation:floatBg linear infinite;
}
@keyframes floatBg{
  100%{transform:translateY(-120vh);}
}
</style>
</head>
<body>

<audio id="popSound"><source src="https://assets.mixkit.co/sfx/preview/mixkit-bubble-pop-1993.mp3"></audio>
<audio id="dingSound"><source src="https://assets.mixkit.co/sfx/preview/mixkit-positive-interface-beep-221.mp3"></audio>

<div class="container" id="content">

<img src="https://raw.githubusercontent.com/friendfollowofficial/about/a57288448586e9acebdef505ff8397bd609be80b/logo.png" class="logo">

<h1>Friend Follow</h1>

<div class="stats">
<div class="stat">TikTok<br><div class="number" id="tk"></div></div>
<div class="stat">Instagram<br><div class="number" id="ig"></div></div>
<div class="stat">Facebook<br><div class="number" id="fb"></div></div>
</div>

<div class="reason">
<b>ทำไมต้องใช้บริการกับเรา?</b><br>
ระบบดันยอดอัตโนมัติทำงานรวดเร็ว - ปลอดภัย <br>
เช็คสถานะได้ตลอดเวลา - ให้บริการทุกวัน 24 ชม.
</div>

</div>

<a href="https://line.me/R/ti/p/@geg4960w" class="lineFloat">
ติดต่อแอดมิน
</a>

<script>

/* fade */
window.onload=()=>content.classList.add("show");

/* daily lock */
function seed(max){
let d=new Date().toISOString().slice(0,10);
let h=0;
for(let i=0;i<d.length;i++){h=d.charCodeAt(i)+((h<<5)-h);}
return Math.abs(h%max);
}
tk.innerText=seed(200)+100;
ig.innerText=seed(150)+80;
fb.innerText=seed(120)+60;

/* flowers */
const flowers=["🌸","🌷","🌺"];
for(let i=0;i<10;i++){
let f=document.createElement("div");
f.className="flower";
f.innerText=flowers[Math.floor(Math.random()*flowers.length)];
f.style.left=Math.random()*100+"%";
f.style.animationDuration=(Math.random()*30+20)+"s";
document.body.appendChild(f);
}

/* bubbles */
for(let i=0;i<15;i++){
let b=document.createElement("div");
b.className="bubble";
let size=Math.random()*60+20;
b.style.width=size+"px";
b.style.height=size+"px";
b.style.left=Math.random()*100+"%";
b.style.background="linear-gradient(145deg,#ff9ed6,#caa6ff)";
b.style.opacity=".1";
b.style.animationDuration=(Math.random()*40+30)+"s";
document.body.appendChild(b);
}

/* review */
const names=["Mxxy","Ployya","Jxmmy","Praewa","Namtanx"];
const msgs=["แอดใจดีมากแถมเยอะมาก 💗","ยอดขึ้นเร็วจริง","บริการดีมากค่ะ","ระบบไวสุด ๆ"];
function mask(n){return n[0]+"***"+n[n.length-1];}
function review(){
let div=document.createElement("div");
div.className="reviewBubble";
div.innerHTML="💖 <b>"+mask(names[Math.floor(Math.random()*names.length)])+"</b><br>"+msgs[Math.floor(Math.random()*msgs.length)];
document.body.appendChild(div);
popSound.volume=0.3;popSound.play();
setTimeout(()=>div.remove(),20000);
}
setInterval(review,45000);

/* order */
function order(){
let div=document.createElement("div");
div.className="toast";
div.innerHTML="<b>FF-******</b><br>กำลังดำเนินการ";
document.body.appendChild(div);
dingSound.volume=0.2;dingSound.play();
setTimeout(()=>div.remove(),9000);
}
setInterval(order,25000);

</script>
</body>
</html>
